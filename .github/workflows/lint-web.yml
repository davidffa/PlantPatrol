name: Lint Web
on:
  push:
    paths:
      - web/*
    branches: [ dev ]
  pull_request:
    paths:
      - web/*
    branches: [ dev ]

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run eslint
        run: npm run lint
